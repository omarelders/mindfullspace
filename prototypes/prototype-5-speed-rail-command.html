<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 5: Minimalist Speed-Rail + Command Hotkeys - Mindful Space</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #090b10;
      --bg-canvas: #0f121a;
      --rail-bg: rgba(18, 22, 32, 0.9);
      --rail-border: rgba(255, 255, 255, 0.12);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Canvas Backdrop ── */
    #canvas-container {
      position: absolute;
      inset: 0;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 60% 60%, rgba(34, 197, 94, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    /* Top Demo Header */
    .demo-header {
      position: fixed;
      top: 18px;
      left: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .demo-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }
    .demo-title span {
      color: var(--accent);
      background: rgba(34, 197, 94, 0.18);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .demo-desc {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 340px;
      line-height: 1.4;
    }
    .demo-instructions {
      font-size: 11px;
      color: #4ade80;
    }

    /* ── Spawning Canvas Cards ── */
    .spawned-card {
      position: absolute;
      background: rgba(20, 26, 38, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px;
      color: #fff;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      animation: cardPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      cursor: grab;
      min-width: 190px;
      z-index: 20;
    }
    .spawned-card:active { cursor: grabbing; }
    .spawned-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--card-accent, #22c55e);
    }
    .spawned-card-body {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.5) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── The Speed Rail Container ── */
    .speedrail-wrapper {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 90;
    }

    /* The Vertical Speed Spine */
    .speedrail-spine {
      background: var(--rail-bg);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid var(--rail-border);
      border-radius: 24px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.7),
        0 1px 0 rgba(255, 255, 255, 0.15) inset;
      margin-bottom: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px) scale(0.88);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .speedrail-spine.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* Individual Speed Item */
    .speed-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.18s, transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    }

    .speed-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px var(--item-glow, rgba(34, 197, 94, 0.4));
      transform: translateX(-4px) scale(1.08);
    }

    .speed-btn:active {
      transform: scale(0.92);
    }

    .speed-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
      color: var(--item-color, #fff);
    }

    /* Inline Keyboard Hotkey Badge */
    .key-badge {
      position: absolute;
      bottom: 3px;
      right: 3px;
      font-size: 9px;
      font-weight: 800;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 1px 3px;
      border-radius: 4px;
      line-height: 1;
      opacity: 0.8;
    }

    /* Tooltip with Full Title + Hotkey */
    .speed-tooltip {
      position: absolute;
      right: calc(100% + 14px);
      top: 50%;
      transform: translateY(-50%) translateX(6px) scale(0.92);
      background: rgba(18, 22, 32, 0.95);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
    }
    .speed-tooltip kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-family: monospace;
      color: var(--accent);
    }

    .speed-btn:hover .speed-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%) translateX(0) scale(1);
    }

    /* ── Trigger FAB ── */
    .speed-trigger {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.45), 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .speed-trigger:hover {
      transform: translateY(-2px) scale(1.08);
      box-shadow: 0 12px 32px rgba(34, 197, 94, 0.65);
    }
    .speed-trigger svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.3;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .speedrail-spine.is-open + .speed-trigger svg {
      transform: rotate(135deg);
    }
  </style>
</head>
<body>

  <!-- Canvas Backdrop -->
  <div id="canvas-container"></div>

  <!-- Header Info -->
  <div class="demo-header">
    <div class="demo-title">Concept 5: Speed-Rail with Keyboard Hotkeys <span>PROTOTYPE</span></div>
    <div class="demo-desc">
      A lightning-fast pro-grade rail. Press single keyboard hotkeys anywhere on the canvas (e.g. <code>T</code> for Todo, <code>N</code> for Note, <code>H</code> for Habit) to spawn cards instantly!
    </div>
    <div class="demo-instructions">⌨️ Try pressing [N], [T], [H], [C], [Q], [S], [L] on your keyboard now!</div>
  </div>

  <!-- The Speed Rail Component -->
  <div class="speedrail-wrapper">
    <div class="speedrail-spine is-open" id="speedSpine">
      <!-- 12 Items generated dynamically -->
    </div>

    <!-- Trigger -->
    <button class="speed-trigger" id="speedTrigger" title="Toggle Speed Rail">
      <i data-lucide="plus"></i>
    </button>
  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playKeyboardSound(freq = 580) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    const CARDS = [
      { id: 'label', title: 'Label', key: 'L', icon: 'tag', color: '#EF4444', glow: 'rgba(239, 68, 68, 0.4)' },
      { id: 'singlenote', title: 'Single Note', key: 'S', icon: 'sticky-note', color: '#F59E0B', glow: 'rgba(245, 158, 11, 0.4)' },
      { id: 'note', title: 'Note', key: 'N', icon: 'file-text', color: '#EAB308', glow: 'rgba(234, 179, 8, 0.4)' },
      { id: 'todo-list', title: 'Todo List', key: 'T', icon: 'list-todo', color: '#10B981', glow: 'rgba(16, 185, 129, 0.4)' },
      { id: 'counter', title: 'Counter', key: 'C', icon: 'hash', color: '#06B6D4', glow: 'rgba(6, 182, 212, 0.4)' },
      { id: 'timer', title: 'Timer', key: 'M', icon: 'timer', color: '#3B82F6', glow: 'rgba(59, 130, 246, 0.4)' },
      { id: 'stopwatch', title: 'Stopwatch', key: 'W', icon: 'timer-reset', color: '#6366F1', glow: 'rgba(99, 102, 241, 0.4)' },
      { id: 'picture', title: 'Picture', key: 'P', icon: 'image', color: '#EC4899', glow: 'rgba(236, 72, 153, 0.4)' },
      { id: 'quick-links', title: 'Quick Links', key: 'K', icon: 'link-2', color: '#14B8A6', glow: 'rgba(20, 184, 166, 0.4)' },
      { id: 'calendar', title: 'Calendar', key: 'A', icon: 'calendar-days', color: '#8B5CF6', glow: 'rgba(139, 92, 246, 0.4)' },
      { id: 'habit', title: 'Habit', key: 'H', icon: 'circle-check', color: '#F97316', glow: 'rgba(249, 115, 22, 0.4)' },
      { id: 'quote', title: 'Quote', key: 'Q', icon: 'quote', color: '#D946EF', glow: 'rgba(217, 70, 239, 0.4)' }
    ];

    const spine = document.getElementById('speedSpine');
    const trigger = document.getElementById('speedTrigger');
    const canvasContainer = document.getElementById('canvas-container');

    // Render 12 Speed Buttons
    CARDS.forEach(card => {
      const btn = document.createElement('button');
      btn.className = 'speed-btn';
      btn.style.setProperty('--item-color', card.color);
      btn.style.setProperty('--item-glow', card.glow);

      btn.innerHTML = `
        <i data-lucide="${card.icon}"></i>
        <span class="key-badge">${card.key}</span>
        <div class="speed-tooltip">
          <span>${card.title}</span>
          <kbd>${card.key}</kbd>
        </div>
      `;

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        spawnCard(card);
        playKeyboardSound(640);
      });

      spine.appendChild(btn);
    });

    lucide.createIcons();

    // Toggle Spine
    trigger.addEventListener('click', () => {
      spine.classList.toggle('is-open');
      playKeyboardSound(spine.classList.contains('is-open') ? 540 : 360);
    });

    // Global Keydown Listeners for hotkeys
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const key = e.key.toUpperCase();
      const matched = CARDS.find(c => c.key === key);
      if (matched) {
        spawnCard(matched);
        playKeyboardSound(700);
      }
    });

    // Spawn card logic
    function spawnCard(card) {
      const cardEl = document.createElement('div');
      cardEl.className = 'spawned-card';
      cardEl.style.setProperty('--card-accent', card.color);

      const x = Math.max(80, Math.min(window.innerWidth - 340, window.innerWidth / 2 - 120 + (Math.random() * 220 - 110)));
      const y = Math.max(80, Math.min(window.innerHeight - 260, window.innerHeight / 2 - 90 + (Math.random() * 180 - 90)));
      cardEl.style.left = `${x}px`;
      cardEl.style.top = `${y}px`;

      cardEl.innerHTML = `
        <div class="spawned-card-header">
          <i data-lucide="${card.icon}" style="width: 16px; height: 16px;"></i>
          <span>${card.title}</span>
          <span style="margin-left: auto; font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px;">[${card.key}]</span>
        </div>
        <div class="spawned-card-body">
          Instantly created with hotkey. Drag to rearrange!
        </div>
      `;

      let isDragging = false, startX, startY, initX, initY;
      cardEl.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initX = cardEl.offsetLeft;
        initY = cardEl.offsetTop;
        cardEl.style.zIndex = 50;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        cardEl.style.left = `${initX + (e.clientX - startX)}px`;
        cardEl.style.top = `${initY + (e.clientY - startY)}px`;
      });
      window.addEventListener('mouseup', () => isDragging = false);

      canvasContainer.appendChild(cardEl);
      lucide.createIcons();
    }
  </script>
</body>
</html>
